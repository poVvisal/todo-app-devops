name: CI pipeline to staging/production environments
on:
    pull_request:
        branches:
            - staging
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        name: Set up, test and build project
        env:
            PORT: 3000
            P0RT: 3001
        steps:
            - name: checkout code
              uses: actions/checkout@v3

            - name: install dependencies
              run: npm ci

            - name: run tests   
              run: npm test

            - name: build project
              run: |
                echo "Run command to build project if present"
                npm run build --if-present